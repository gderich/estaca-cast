name: Validar Estaca Cast Camera

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-camera/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: android-camera
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Salvar log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EstacaCast-Camera-build-log
          path: android-camera/build.log
          if-no-files-found: ignore

      - name: Salvar APK de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EstacaCast-Camera-debug
          path: android-camera/app/build/outputs/apk/debug/app-debug.apk
