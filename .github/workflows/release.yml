name: Build e publicar Estaca Cast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.release-trigger'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Garantir tag da versão
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $remoteTag) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          } else {
            Write-Host "Tag $tag já existe."
          }

      - name: Instalar dependências
        run: npm install

      - name: Compilar instalador Windows
        run: npm run build:win -- --publish never

      - name: Criar Release se necessário
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title $env:APP_VERSION --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar arquivos Windows
        shell: pwsh
        run: |
          $files = @('dist/EstacaCast-Setup.exe', 'dist/EstacaCast-Setup.exe.blockmap')
          if (Test-Path 'dist/latest.yml') { $files += 'dist/latest.yml' }
          gh release upload $env:RELEASE_TAG @files --clobber --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Validar assinatura Android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 não configurado"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD não configurado"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS não configurado"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD não configurado"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/estacacast-camera.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/estacacast-camera.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar APK Android assinado
        working-directory: android-camera
        run: gradle :app:assembleRelease --no-daemon

      - name: Preparar APK
        run: cp android-camera/app/build/outputs/apk/release/app-release.apk EstacaCast-Camera.apk

      - name: Definir tag da Release
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Anexar APK à Release
        shell: bash
        run: gh release upload "$RELEASE_TAG" EstacaCast-Camera.apk --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
