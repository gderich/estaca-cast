name: Build e publicar Estaca Cast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.release-trigger'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Garantir tag da versão
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $remoteTag) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          } else {
            Write-Host "Tag $tag já existe."
          }

      - name: Instalar dependências
        run: npm install

      - name: Build e publicar instalador
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Compilar APK Android
        working-directory: android-camera
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android-camera/app/build/outputs/apk/debug/app-debug.apk EstacaCast-Camera.apk

      - name: Definir tag da Release
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Anexar APK à Release
        shell: bash
        run: gh release upload "$RELEASE_TAG" EstacaCast-Camera.apk --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
